name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Visit app
        env:
          APP_URL: https://signature-inventory-app.streamlit.app/
        run: |
          python - <<'EOF'
          import os
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(os.environ["APP_URL"], timeout=60000)
              page.wait_for_timeout(5000)
              # If asleep, click the wake-up button
              btn = page.get_by_role("button", name="Yes, get this app back up!")
              if btn.count() > 0:
                  print("App was asleep, waking it...")
                  btn.click()
                  page.wait_for_timeout(60000)
              else:
                  print("App is awake.")
              browser.close()
          EOF
